name: Deploy Production (jivo.in)

# Production deploys ONLY from main. The testing branch can never trigger this
# workflow, and this workflow only ever passes Production paths/service to the
# deployment script.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never run two production deploys at once. A queued run waits instead of
# fighting over the working copy. The group is production-only, so a testing
# deploy runs in parallel without being blocked or blocking.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main to jivo.in
    runs-on: ubuntu-latest
    environment: production

    env:
      APP_PATH: C:\LiveProjects\JIVO_WEBSITE\NEXT_JS_WEB_JIVO.IN_LIVE
      DEPLOY_SCRIPT_DIR: C:\LiveProjects\JIVO_WEBSITE\Deploy

    steps:
      - name: Deploy to Windows Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          command_timeout: 30m
          envs: APP_PATH,DEPLOY_SCRIPT_DIR
          script: |
            cmd.exe /D /S /C "cd /d %APP_PATH% && git fetch origin main && (if not exist "%DEPLOY_SCRIPT_DIR%" mkdir "%DEPLOY_SCRIPT_DIR%") && git show origin/main:scripts/deploy-jivo-windows.ps1 > "%DEPLOY_SCRIPT_DIR%\deploy-production.ps1" && powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%DEPLOY_SCRIPT_DIR%\deploy-production.ps1" -Environment Production"
