name: Deploy Production (jivo.in)

# Production deploys ONLY from main. The testing branch can never trigger
# this workflow, and it only ever passes Production paths/service downstream.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never run two production deploys at once; a queued run waits instead of fighting over the working copy. Testing uses its own group and is unaffected.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main to jivo.in
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to Windows Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          command_timeout: 30m
          # Abort the remote shell on the first failing command so a non-zero
          # exit can never be masked by a later succeeding one.
          script_stop: true
          # IMPORTANT: the `envs:` input is deliberately NOT used. The action
          # renders it as Linux "export VAR=value" lines, which cmd.exe cannot
          # parse -> "'export' is not recognized as an internal or external
          # command". Every value is static and non-secret, so the payload
          # below carries them inline instead.
          #
          # The remote shell is cmd.exe (the OpenSSH-on-Windows default). We
          # hand off to PowerShell via a single -EncodedCommand payload
          # (UTF-16LE base64). Base64 is only [A-Za-z0-9+/=] -- no spaces,
          # quotes, backslashes, carets or percent signs -- so it is
          # structurally immune to both cmd.exe and PowerShell escaping.
          # Folders with spaces therefore cannot break it.
          #
          # DO NOT hand-edit the payload. It is generated from
          # scripts/ci/bootstrap-deploy.ps1 by:
          #   ./scripts/ci/build-bootstrap-payload.ps1
          script: |
            powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand 